<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon set — FPT logo v2 (fpt-brand v1.2.0): byte copies of brand/logos/icons under /brand (gate: scripts/check-logo-assets.mjs) -->
    <link rel="icon" href="/brand/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/apple-touch-icon-180.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta name="theme-color" content="#F42821" />
    <meta name="color-scheme" content="dark" />
    <meta name="author" content="Fiper Pro Traders" />

    <!-- Fonts: self-hosted from the fpt-brand v1.2.0 package (brand/fonts, OFL) — byte copies under /brand/fonts, declared inside the one
         bundled stylesheet (src/fonts.css), font-display: swap; no Google Fonts. Arabic pages preload the regular Plex Arabic face (prerender.mjs). -->

    <!-- title / description / canonical / hreflang / Open Graph / Twitter: rendered ONCE per page by src/components/SEO.jsx (React 19 hoistable head tags)
         and written into the static HTML of every route × language at build time (scripts/prerender.mjs). -->

    <!-- Schema.org Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Fiper Pro Traders",
      "alternateName": "FPT",
      "url": "https://fptraders.com/",
      "logo": "https://fptraders.com/brand/fpt-tile-512.png",
      "description": "Fiper Pro Traders (FPT) — Part of Fiper Global. A one-phase evaluation on a simulated account; funded accounts up to 200,000 USD with an 80 % reward share.",
      "sameAs": [
        "https://linktr.ee/fiper"
      ],
      "parentOrganization": {
        "@type": "Organization",
        "name": "Fiper Global"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
